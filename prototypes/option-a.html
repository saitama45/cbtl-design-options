*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:#F5F1F9;color:#181D27;font:14px/1.5 'DM Sans',system-ui,sans-serif;display:flex;justify-content:center;gap:48px;padding:20px;overflow:hidden;-webkit-tap-highlight-color:transparent}
aside{width:300px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:none}
.back{align-self:flex-start;color:#181D27;font-size:13px;font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
aside h1{font:700 28px/1.15 'DM Sans',system-ui,sans-serif;margin:0}
aside p{margin:0;color:#5C5468}
nav.switch{display:flex;gap:6px;flex-wrap:wrap}
nav.switch a{padding:6px 10px;border:1px solid #D8CFE3;border-radius:6px;color:#181D27;text-decoration:none;font-size:12.5px}
nav.switch a[aria-current]{background:#532D6D;color:#FFFFFF;border-color:#532D6D;font-weight:700}
#replay{align-self:flex-start;padding:8px 12px;min-height:40px;background:transparent;color:#181D27;border:1px solid #D8CFE3;border-radius:6px;font:inherit;cursor:pointer}
#screen-list{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:1px;border-top:1px solid #D8CFE3;padding-top:8px}
#screen-list h2{font:700 11px/1.4 'DM Sans',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#5C5468;margin:12px 0 4px}
#screen-list button{all:unset;display:block;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
#screen-list button:hover,#screen-list button:focus-visible{background:#D8CFE3}
#screen-list button[aria-current=true]{background:#532D6D;color:#FFFFFF;font-weight:700}
#device-wrap{flex:none;align-self:center}
#device{width:414px;height:868px;transform-origin:top left;background:#0B0A0C;border-radius:58px;padding:12px;box-shadow:0 24px 70px #0000004d}
#viewport{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;background:#000}
.scroller::-webkit-scrollbar{display:none}
@media (max-width:820px){
body{flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:0 12px 12px}
aside{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:6px 0 4px}
.intro,.wide,#screen-list{display:none}
.back{align-self:center;display:inline-flex;align-items:center;min-height:36px;margin-right:auto}
nav.switch{flex-wrap:nowrap}
nav.switch a{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;padding:0 8px}
#replay{align-self:center;min-height:36px;padding:0 10px;font-size:12.5px}
.note{order:3;width:100%;font-size:11px;line-height:1.3}
}
@media (max-width:520px){
body{padding:0;gap:0}
aside{padding:4px 8px}
#device-wrap{align-self:flex-start;width:100vw;overflow:hidden}
#device{width:390px;padding:0;border-radius:0;box-shadow:none;background:none}
#viewport{border-radius:0}
}

  /** Step response of a damped spring, mass 1. `dur` only sets the track length. */
  function spring(stiffness, damping) {
    const w0 = Math.sqrt(stiffness);
    const zeta = damping / (2 * w0);
    return (ms) => {
      const t = ms / 1000;
      if (zeta < 1) {
        const wd = w0 * Math.sqrt(1 - zeta * zeta);
        return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + ((zeta * w0) / wd) * Math.sin(wd * t));
      }
      return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    };
  }

  const E = {
    out: cubic(0.2, 0.9, 0.2, 1),
    slowOut: cubic(0.16, 1, 0.3, 1),
    inOut: cubic(0.76, 0, 0.24, 1),
    press: cubic(0.7, 0, 0.2, 1),
    in: cubic(0.6, 0, 1, 0.6),
    linear: (t) => t,
  };

  // ── Timeline ──────────────────────────────────────────────────────────────

  const TL = {
    now: 0,
    tracks: [],
    add(track) { track.start = TL.now + (track.delay || 0); TL.tracks.push(track); track.frame(0, track); return track; },
    at(delay, fn) { TL.tracks.push({ start: TL.now + delay, dur: 0, once: fn, frame() {} }); },
    advance(now) {
      TL.now = now;
      const keep = [];
      // Index loop: a callback may schedule more tracks while this runs.
      for (let i = 0; i < TL.tracks.length; i++) {
        const tr = TL.tracks[i];
        if (tr.dead) continue;
        const local = now - tr.start;
        if (local < 0) { keep.push(tr); continue; }
        if (tr.once) { tr.once(); continue; }
        if (tr.loop) { tr.frame(local, tr); keep.push(tr); continue; }
        const p = tr.dur ? clamp(local / tr.dur) : 1;
        tr.frame(p >= 1 ? 1 : tr.sp ? tr.sp(local) : (tr.ease || E.linear)(p), tr, local);
        if (p < 1) keep.push(tr); else if (tr.done) tr.done();
      }
      TL.tracks = keep;
    },
    clear() { TL.tracks = []; },
  };

  /** Tween one element. `set(el, v)` receives eased progress (springs may pass 1). */
  function tween(el, set, opts) {
    return TL.add({ delay: opts.d || 0, dur: opts.dur || 400, ease: opts.ease, sp: opts.sp, done: opts.done, frame: (v) => set(el, v) });
  }

  // ── Entrance animations, by option character ──────────────────────────────

  const PERSONA = {
    a: { rise: { dur: 380, ease: E.out }, stagger: 1, card: { sp: spring(220, 24), dur: 620 }, pop: { sp: spring(420, 22), dur: 480 }, stamp: { sp: spring(420, 22), dur: 480 } },
    b: { rise: { dur: 320, ease: E.out }, stagger: 0.8, card: { dur: 340, ease: E.press }, pop: { dur: 260, ease: E.press }, stamp: { dur: 180, ease: E.in } },
    c: { rise: { dur: 620, ease: E.slowOut }, stagger: 1.35, card: { dur: 760, ease: E.slowOut }, pop: { sp: spring(300, 26), dur: 620 }, stamp: { sp: spring(300, 26), dur: 620 } },
    d: { rise: { dur: 420, ease: E.out }, stagger: 1, card: { dur: 480, ease: E.out }, pop: { sp: spring(380, 26), dur: 480 }, stamp: { dur: 200, ease: E.in } },
  };

  function animateEntrance(rootEl, optionId) {
    const P = PERSONA[optionId];
    rootEl.querySelectorAll('[data-an]').forEach((el) => {
      const an = JSON.parse(el.dataset.an);
      const d = (an.d || 0) * P.stagger;
      RUN[an.k](el, an, d, P);
    });
    rootEl.querySelectorAll('[data-part="spin"]').forEach((p) => {
      const track = TL.add({ loop: true, frame: (t) => { if (!p.isConnected && track) track.dead = true; p.setAttribute('transform', `rotate(${(t * 0.36) % 360} ${p.ownerSVGElement.viewBox.baseVal.width / 2} ${p.ownerSVGElement.viewBox.baseVal.height / 2})`); } });
    });
  }

  const RUN = {
    // Text rises out of a fixed mask line.
    rise(el, an, d, P) {
      tween(el, (e, v) => {
        const hidden = clamp(1 - v) * 100;
        e.style.clipPath = `inset(-20% -5% ${hidden}% -5%)`;
        e.style.transform = `translateY(${hidden}%)`;
      }, { d, ...P.rise });
    },
    fade(el, an, d) { tween(el, (e, v) => { e.style.opacity = v * (Number(e.dataset.baseOp) || 1); }, { d, dur: 300 }); },
    pop(el, an, d, P) {
      tween(el, (e, v) => { e.style.transform = `scale(${Math.max(0, v)})`; e.style.opacity = clamp(v * 3); }, { d, ...P.pop });
    },
    stamp(el, an, d, P, optionId) {
      if (P === PERSONA.b || P === PERSONA.d) {
        // Drops from above the card and lands hard, with no overshoot.
        tween(el, (e, v) => { e.style.transform = `scale(${lerp(1.7, 1, v)})`; e.style.opacity = clamp(v * 2.5); }, { d, ...P.stamp });
        return;
      }
      tween(el, (e, v) => { e.style.transform = `scale(${Math.max(0, v)})`; e.style.opacity = clamp(v * 4); }, { d, ...P.stamp });
    },
    // The one big moment: a stamp being pressed onto the card.
    press(el, an, d, P) {
      tween(el, (e, v) => { e.style.transform = `scale(${lerp(2.4, 1, v)})`; e.style.opacity = clamp(v * 3); }, { d, dur: 240, ease: E.in });
      const host = el.parentElement;
      TL.at(d + 240, () => {
        tween(host, (e, v) => { e.style.transform = `scale(${1 - 0.04 * Math.sin(Math.PI * clamp(v))})`; }, { dur: 240, ease: E.out });
      });
    },
    count(el, an, d, P) {
      const from = an.from || 0;
      const suffix = an.suffix || '';
      el.textContent = `${from}${suffix}`;
      tween(el, (e, v) => { e.textContent = `${Math.round(lerp(from, an.to, clamp(v)))}${suffix}`; }, { d, dur: an.from ? 360 : 800, ease: E.slowOut });
    },
    bar(el, an, d) {
      el.style.transformOrigin = 'left center';
      tween(el, (e, v) => { e.style.transform = `scaleX(${clamp(v)})`; }, { d, dur: 700, ease: E.slowOut });
    },
    // Line-work draws itself, one line after another.
    draw(el, an, d) {
      const baseOp = el.style.opacity;
      el.querySelectorAll('[data-part="line"]').forEach((line, i) => {
        line.setAttribute('pathLength', '1');
        line.style.strokeDasharray = '1';
        tween(line, (l, v) => { l.style.strokeDashoffset = String(1 - clamp(v)); }, { d: d + i * 40, dur: an.dur || 1200, ease: E.slowOut });
      });
      el.style.opacity = baseOp;
    },
    // The hero logo is pressed on like a seal, and the surface gives a little.
    seal(el, an, d) {
      tween(el, (e, v) => { e.style.transform = `scale(${lerp(1.45, 1, v)})`; e.style.opacity = clamp(v * 3); }, { d, dur: 260, ease: E.in });
      TL.at(d + 260, () => {
        tween(el, (e, v) => { e.style.transform = `scale(${1 + 0.03 * Math.sin(Math.PI * clamp(v))})`; }, { dur: 280, ease: E.out });
      });
    },
    // The brand book's light streak rises along the frame edge.
    aura(el, an, d) {
      el.style.clipPath = 'inset(100% 0 0 0)';
      tween(el, (e, v) => { e.style.clipPath = `inset(${(1 - clamp(v)) * 100}% 0 0 0)`; }, { d, dur: 900, ease: E.slowOut });
    },
    // The emblem assembles: ring draws, bar crosses it, then bean and leaf land.
    emblem(el, an, d) {
      const svg = el.querySelector('svg');
      const part = (name) => [...svg.querySelectorAll(`[data-part="${name}"]`)];
      part('ring').forEach((r) => {
        r.setAttribute('pathLength', '1');
        r.style.strokeDasharray = '1';
        r.setAttribute('transform', 'rotate(-90 223 225)');
        tween(r, (e, v) => { e.style.strokeDashoffset = String(1 - clamp(v)); }, { d, dur: 720, ease: E.slowOut });
      });
      part('bar').forEach((b, i) => {
        b.setAttribute('pathLength', '1');
        b.style.strokeDasharray = '1';
        tween(b, (e, v) => { e.style.strokeDashoffset = String(1 - clamp(v)); }, { d: d + 360 + i * 120, dur: 320, ease: E.out });
      });
      for (const [name, delay] of [['amp', 520], ['bean', 620], ['leaf', 720]]) {
        part(name).forEach((n) => {
          n.style.transformBox = 'fill-box';
          n.style.transformOrigin = 'center';
          tween(n, (e, v) => { e.style.transform = `scale(${Math.max(0, v)})`; e.style.opacity = clamp(v * 3); }, { d: d + delay, sp: spring(320, 22), dur: 560 });
        });
      }
    },
    // Timber slats rise into place across the panel.
    slats(el, an, d) {
      el.querySelectorAll('rect').forEach((r, i) => {
        r.style.transformBox = 'fill-box';
        r.style.transformOrigin = 'center bottom';
        tween(r, (e, v) => { e.style.transform = `scaleY(${clamp(v)})`; }, { d: d + i * 16, dur: 520, ease: E.press });
      });
    },
    cardIn(el, an, d, P) { tween(el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 26}px)`; e.style.opacity = clamp(v * 2.2); }, { d, ...P.card }); },
    rowIn(el, an, d, P) { tween(el, (e, v) => { e.style.transform = `translateX(${(1 - v) * 18}px)`; e.style.opacity = clamp(v * 2); }, { d, ...P.rise }); },
    sheetUp(el, an, d, P) { tween(el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 90}px)`; }, { d, ...P.card }); },
    sheet(el, an, d, P) { tween(el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 100}%)`; }, { d, ...(P === PERSONA.b ? { dur: 360, ease: E.press } : P === PERSONA.c ? { dur: 640, ease: E.slowOut } : { sp: spring(200, 24), dur: 680 }) }); },
    scrim(el, an, d) {
      const bg = getComputedStyle(el).backgroundColor;
      const m = bg.match(/[\d.]+/g);
      const a = m && m[3] !== undefined ? Number(m[3]) : 1;
      tween(el, (e, v) => { e.style.backgroundColor = `rgba(${m[0]},${m[1]},${m[2]},${a * clamp(v)})`; }, { d, dur: 240, ease: E.out });
    },
    dialog(el, an, d, P) {
      tween(el, (e, v) => {
        e.style.transform = P === PERSONA.b ? `translateY(${(1 - v) * 18}px)` : `scale(${lerp(0.9, 1, v)})`;
        e.style.opacity = clamp(v * 2.4);
      }, { d, ...(P === PERSONA.b ? { dur: 260, ease: E.press } : P === PERSONA.c ? { dur: 460, ease: E.slowOut } : { sp: spring(320, 26), dur: 460 }) });
    },
    // The QR plate lands, then its modules wipe on from the top.
    plate(el, an, d, P) {
      tween(el, (e, v) => { e.style.transform = `scale(${lerp(0.88, 1, v)})`; e.style.opacity = clamp(v * 3); }, { d, ...P.card });
      const svg = el.querySelector('svg');
      if (svg) tween(svg, (e, v) => { e.style.clipPath = `inset(0 0 ${(1 - clamp(v)) * 100}% 0)`; }, { d: d + 140, dur: 620, ease: E.slowOut });
    },
    wipe(el, an, d) { tween(el, (e, v) => { e.style.clipPath = `inset(0 ${(1 - clamp(v)) * 100}% 0 0)`; }, { d, dur: 460, ease: E.out }); },
    riseIn(el, an, d) { tween(el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 24}px)`; e.style.opacity = clamp(v * 2); }, { d, dur: 460, ease: E.out }); },
  };

  root.CbtlMotion = { TL, tween, animateEntrance, E, spring, clamp, lerp };
})(typeof window !== 'undefined' ? window : globalThis);

<script>// The phone: screen stack, routing and each option's transitions. Shared by the
// clickable prototype and the film, which only differ in who presses the buttons.
(function (root) {
  const { TL, tween, animateEntrance, E, spring, clamp, lerp } = root.CbtlMotion;
  const { renderScreen, hexToCss } = root.CbtlRender;
  const SCREEN_W = 390;
  const SCREEN_H = 844;

  function createPhone(viewport, model) {
    const { theme, screens } = model;
    const byId = Object.fromEntries(screens.map((s) => [s.id, s]));
    const optionId = theme.id;
    const TAB_INDEX = { home: 0, rewards: 1, history: 2, profile: 3 };
    let current = null; // { screen, el, scroller }
    let overlay = null; // { id, el }
    let busy = false;
    let autoTrack = null;
    const listeners = [];

    function build(id) {
      const screen = byId[id];
      const isOverlay = !!screen.clipTo;
      const el = renderScreen(isOverlay ? { ...screen, fixed: screen.fixed, clipTo: undefined } : screen, theme);
      el.style.position = 'absolute';
      el.style.left = '0';
      el.style.top = '0';
      el.style.height = '100%';
      el.style.minHeight = '0';
      const body = el.querySelector('[data-role="body"]');
      const scroller = document.createElement('div');
      scroller.className = 'scroller';
      scroller.style.cssText = `position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:${hexToCss(screen.bg)}`;
      el.insertBefore(scroller, body);
      scroller.appendChild(body);
      if (body.style.flexGrow) body.style.minHeight = '100%';
      body.style.display = 'flex';
      return { screen, el, scroller };
    }

    const zOf = (layer, z) => { layer.el.style.zIndex = String(z); };

    function fire(id) {
      for (const fn of listeners) fn(id);
      const screen = byId[id];
      if (autoTrack) autoTrack.dead = true;
      autoTrack = null;
      if (screen.auto && !phone.manualOnly) {
        const track = { start: TL.now + screen.auto.after, dur: 0, frame() {}, once: () => { if (!track.dead) go(screen.auto.go, screen.auto.tx); } };
        TL.tracks.push(track);
        autoTrack = track;
      }
    }

    function finishLayers(next, old) {
      if (old && old.el.parentElement) old.el.remove();
      current = next;
      busy = false;
    }

    /** Dismiss an open dialog or sheet back to the screen under it. */
    function closeOverlay() {
      const { el } = overlay;
      overlay = null;
      tween(el, (e, v) => { e.style.opacity = String(1 - clamp(v)); }, { dur: 180, ease: E.out, done: () => el.remove() });
    }

    function go(id, tx = 'push', origin) {
      if (busy) return;
      const target = byId[id];

      // Toggling a dialog over the screen beneath keeps that screen's scroll.
      if (target.base && current && current.screen.id === target.base) {
        if (overlay) overlay.el.remove();
        const built = build(id);
        const scrim = built.el.querySelector('[data-name="scrim"]');
        current.el.appendChild(scrim);
        // Fit the window, not the 844 the frame was drawn at. A sheet too tall for a
        // short phone window scrolls from its top instead of losing it.
        scrim.style.height = '100%';
        scrim.style.overflowY = 'auto';
        scrim.style.scrollbarWidth = 'none';
        if (scrim.scrollHeight > scrim.clientHeight) scrim.style.justifyContent = 'flex-start';
        overlay = { id, el: scrim };
        animateEntrance(scrim, optionId);
        fire(id);
        wire(scrim);
        return;
      }
      if (overlay && id === current.screen.id) { closeOverlay(); fire(id); return; }
      if (overlay) { overlay = null; }

      const next = build(id);
      wire(next.el);
      const old = current;
      viewport.appendChild(next.el);
      // The splash is drawn to fill 844; a shorter window shows its middle.
      if (id === 'splash') next.scroller.scrollTop = (next.scroller.scrollHeight - next.scroller.clientHeight) / 2;
      fire(id);

      if (tx === 'none' || !old) {
        if (old) next.scroller.scrollTop = old.scroller.scrollTop;
        if (tx !== 'none') animateEntrance(next.el, optionId);
        finishLayers(next, old);
        return;
      }

      busy = true;
      const run = TX[tx] || TX.push;
      run(next, old, origin);
    }

    // ── Transitions ─────────────────────────────────────────────────────────

    const enter = (layer) => animateEntrance(layer.el, optionId);
    const floodColor = () => (optionId === 'a' ? theme.c.primary : optionId === 'b' ? theme.c.wood : '#FFFFFF');
    const rectIn = (el) => {
      const a = viewport.getBoundingClientRect();
      const b = el.getBoundingClientRect();
      const k = a.width / SCREEN_W;
      return { x: (b.left - a.left) / k, y: (b.top - a.top) / k, w: b.width / k, h: b.height / k };
    };
    const shape = (fill, z = 40) => {
      const s = document.createElement('div');
      s.style.cssText = `position:absolute;background:${fill};z-index:${z};pointer-events:none`;
      viewport.appendChild(s);
      return s;
    };
    const hide = (layer) => { layer.el.style.visibility = 'hidden'; };
    const show = (layer) => { layer.el.style.visibility = 'visible'; };

    /** One colour, one shape: it floods the screen from where you tapped, the new
     *  screen appears underneath, and the shape rolls away. */
    function flood(next, old, origin, color) {
      const from = origin ? rectIn(origin) : { x: SCREEN_W / 2, y: SCREEN_H / 2, w: 0, h: 0 };
      const cx = from.x + from.w / 2;
      const cy = from.y + from.h / 2;
      const s = shape(color);
      s.style.inset = '0';
      hide(next);
      tween(s, (e, v) => { e.style.clipPath = `circle(${lerp(0, 1000, clamp(v))}px at ${cx}px ${cy}px)`; }, {
        dur: 420, ease: E.press,
        done: () => {
          show(next);
          old.el.remove();
          enter(next);
          tween(s, (e, v) => { e.style.clipPath = `inset(0 0 ${clamp(v) * 100}% 0)`; }, {
            dur: 380, ease: E.press, done: () => { s.remove(); finishLayers(next, null); },
          });
        },
      });
    }

    /** Golden Caramel pours down the screen on a moving wave, the way milk meets coffee
     *  in the book's key visuals (p44), and the next screen appears behind it. */
    function pour(next, old) {
      const s = shape(theme.c.accent);
      s.style.inset = '0';
      const edge = (y, v, phase) => {
        const amp = 30 * Math.sin(Math.PI * clamp(v));
        const pts = [];
        for (let x = SCREEN_W; x >= 0; x -= 15) pts.push(`${x}px ${(y + amp * Math.sin(x / 62 + phase + v * 5)).toFixed(1)}px`);
        return pts.join(',');
      };
      const height = viewport.clientHeight;
      hide(next);
      tween(s, (e, v) => { e.style.clipPath = `polygon(0px 0px,${SCREEN_W}px 0px,${edge(lerp(-40, height + 40, clamp(v)), clamp(v), 0)})`; }, {
        dur: 420, ease: E.press,
        done: () => {
          show(next);
          old.el.remove();
          enter(next);
          tween(s, (e, v) => { e.style.clipPath = `polygon(0px ${height}px,${SCREEN_W}px ${height}px,${edge(lerp(-40, height + 40, clamp(v)), clamp(v), 2)})`; }, {
            dur: 420, ease: E.press, done: () => { s.remove(); finishLayers(next, null); },
          });
        },
      });
    }

    const TX = {
      flood(next, old, origin) { if (optionId === 'd') { pour(next, old); return; } flood(next, old, origin, optionId === 'c' ? theme.c.hero : optionId === 'b' ? theme.c.ink : theme.c.primary); },

      // A black panel crosses like a roller shutter; the screen changes behind it.
      shutter(next, old) {
        const s = shape(theme.c.ink);
        s.style.inset = '0';
        hide(next);
        tween(s, (e, v) => { e.style.clipPath = `inset(0 ${(1 - clamp(v)) * 100}% 0 0)`; }, {
          dur: 300, ease: E.inOut,
          done: () => {
            show(next);
            old.el.remove();
            enter(next);
            tween(s, (e, v) => { e.style.clipPath = `inset(0 0 0 ${clamp(v) * 100}%)`; }, { dur: 300, ease: E.inOut, done: () => { s.remove(); finishLayers(next, null); } });
          },
        });
      },

      push(next, old) {
        if (optionId === 'b') { TX.shutter(next, old); return; }
        if (optionId === 'c') {
          enter(next);
          tween(next.el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 46}px)`; e.style.opacity = clamp(v * 1.8); }, { dur: 560, ease: E.slowOut });
          tween(old.el, (e, v) => { e.style.transform = `scale(${lerp(1, 0.95, clamp(v))})`; e.style.opacity = 1 - clamp(v * 1.4); }, { dur: 340, ease: E.out, done: () => finishLayers(next, old) });
          return;
        }
        zOf(next, 2);
        enter(next);
        tween(next.el, (e, v) => { e.style.transform = `translateX(${(1 - v) * 100}%)`; }, { sp: spring(220, 26), dur: 560, done: () => { next.el.style.transform = ''; } });
        tween(old.el, (e, v) => { e.style.transform = `translateX(${v * -22}%)`; e.style.filter = `brightness(${1 - 0.1 * clamp(v)})`; }, { sp: spring(220, 26), dur: 560, done: () => finishLayers(next, old) });
      },

      pop(next, old) {
        if (optionId === 'b') { TX.shutter(next, old); return; }
        if (optionId === 'c') {
          enter(next);
          tween(next.el, (e, v) => { e.style.transform = `scale(${lerp(0.96, 1, v)})`; e.style.opacity = clamp(v * 1.8); }, { dur: 520, ease: E.slowOut });
          tween(old.el, (e, v) => { e.style.transform = `translateY(${v * 40}px)`; e.style.opacity = 1 - clamp(v * 1.6); }, { dur: 300, ease: E.out, done: () => finishLayers(next, old) });
          zOf(old, 2);
          return;
        }
        zOf(old, 2);
        enter(next);
        tween(old.el, (e, v) => { e.style.transform = `translateX(${v * 100}%)`; }, { sp: spring(240, 28), dur: 520, done: () => finishLayers(next, old) });
        tween(next.el, (e, v) => { e.style.transform = `translateX(${(1 - v) * -22}%)`; }, { sp: spring(240, 28), dur: 520 });
      },

      tab(next, old) {
        const fromIndex = TAB_INDEX[old.screen.id.replace(/(Stamped|Unlocked|Stack|Empty|Terms|Claimed)$/, '')];
        const toIndex = TAB_INDEX[next.screen.id.replace(/(Stamped|Unlocked|Stack|Empty|Terms|Claimed)$/, '')];
        old.el.remove();
        enter(next);
        if (fromIndex !== undefined && toIndex !== undefined && fromIndex !== toIndex) tabIndicator(next, fromIndex, toIndex);
        finishLayers(next, null);
      },

      // Member Code: the button itself becomes the page.
      morph(next, old, origin) {
        const from = origin ? rectIn(origin) : { x: SCREEN_W - 80, y: SCREEN_H - 160, w: 60, h: 60 };
        if (optionId === 'c') {
          // Reserve: the white button grows and lands exactly on the white QR plate.
          const plate = next.el.querySelector('[data-name="QR plate"]');
          const to = plate ? rectIn(plate) : { x: 40, y: 200, w: 310, h: 310 };
          const s = shape('#FFFFFF');
          s.style.borderRadius = '30px';
          enter(next);
          tween(next.el, (e, v) => { e.style.opacity = clamp(v * 2); }, { dur: 320, ease: E.out });
          tween(s, (e, v) => {
            e.style.left = `${lerp(from.x, to.x, v)}px`;
            e.style.top = `${lerp(from.y, to.y, v)}px`;
            e.style.width = `${lerp(from.w, to.w, v)}px`;
            e.style.height = `${lerp(from.h, to.h, v)}px`;
            e.style.borderRadius = `${lerp(30, 28, v)}px`;
          }, { dur: 560, ease: E.slowOut, done: () => { tween(s, (e, v) => { e.style.opacity = String(1 - clamp(v)); }, { dur: 160, done: () => s.remove() }); finishLayers(next, old); } });
          return;
        }
        if (optionId === 'b') { flood(next, old, origin, theme.c.wood); return; }
        // Craft's button is caramel, so one shape grows out of it and becomes the transition.
        if (optionId === 'd') { flood(next, old, origin, theme.c.accent); return; }
        // Swirl: a circle opens out of the button, purple at its rim, the page inside.
        zOf(next, 2);
        const cx = from.x + from.w / 2;
        const cy = from.y + from.h / 2;
        const s = shape(theme.c.primary, 3);
        s.style.inset = '0';
        enter(next);
        const sp = spring(170, 24);
        TL.add({
          dur: 640, sp,
          frame: (v) => {
            const rad = lerp(30, 1000, clamp(v));
            next.el.style.clipPath = `circle(${rad}px at ${cx}px ${cy}px)`;
            s.style.clipPath = `circle(${rad}px at ${cx}px ${cy}px)`;
            s.style.opacity = String(1 - clamp(v * 2.4));
          },
          done: () => { next.el.style.clipPath = ''; s.remove(); finishLayers(next, old); },
        });
      },
    };
    TX.sheet = TX.push;
    TX.dialog = TX.push;

    /** The active tab mark travels. In Swirl its two edges ride different springs,
     *  so the leading edge stretches ahead. */
    function tabIndicator(layer, fromIndex, toIndex) {
      const tabs = [...layer.el.querySelectorAll('[data-name^="tab/"]')];
      const nav = layer.el.querySelector('[data-name="tab bar"]');
      if (!tabs.length || !nav) return;
      const mark = optionId === 'c' ? tabs[toIndex] : tabs[toIndex].querySelector('[data-name="indicator"]');
      if (!mark) return;
      const navBox = nav.getBoundingClientRect();
      const box = mark.getBoundingClientRect();
      const k = viewport.getBoundingClientRect().width / SCREEN_W;
      const left = (box.left - navBox.left) / k;
      const top = (box.top - navBox.top) / k;
      const w = box.width / k;
      const h = box.height / k;
      const step = (tabs[toIndex].getBoundingClientRect().left - tabs[fromIndex].getBoundingClientRect().left) / k;
      const color = getComputedStyle(mark).backgroundColor;
      const ghost = document.createElement('div');
      ghost.style.cssText = `position:absolute;top:${top}px;height:${h}px;background:${color};border-radius:${getComputedStyle(mark).borderRadius};pointer-events:none`;
      const saved = mark.style.background;
      mark.style.background = 'transparent';
      tabs.forEach((t) => { t.style.zIndex = '1'; });
      nav.insertBefore(ghost, nav.firstChild);
      const lead = spring(300, 26);
      const trail = spring(200, 22);
      const forward = step > 0;
      TL.add({
        dur: 620, sp: (t) => t,
        frame: (t) => {
          if (t === 1) return;
          const a = lead(t);
          const b = forward ? trail(t) : a;
          const rightEdge = left + w - step * (1 - (forward ? a : trail(t)));
          const leftEdge = left - step * (1 - (forward ? b : a));
          if (optionId === 'a') {
            ghost.style.left = `${leftEdge}px`;
            ghost.style.width = `${rightEdge - leftEdge}px`;
          } else {
            const e = (optionId === 'b' || optionId === 'd' ? E.press : E.slowOut)(clamp(t / (optionId === 'b' || optionId === 'd' ? 240 : 320)));
            ghost.style.left = `${left - step * (1 - e)}px`;
            ghost.style.width = `${w}px`;
          }
        },
        done: () => { mark.style.background = saved; ghost.remove(); },
      });
    }

    // ── Input ───────────────────────────────────────────────────────────────

    function wire(el) {
      el.querySelectorAll('[data-go]').forEach((node) => {
        node.setAttribute('role', 'button');
        node.tabIndex = 0;
        node.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); node.click(); } });
        node.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (phone.locked) return;
          go(node.dataset.go, node.dataset.tx, node);
        });
      });
    }

    const phone = {
      go, byId, listeners, screens, theme, locked: false, manualOnly: false,
      get current() { return current; },
      get screenId() { return overlay ? overlay.id : current && current.screen.id; },
      replay() { if (current) { const id = current.screen.id; current.el.remove(); current = null; overlay = null; go(id, 'enter'); } },
      /** Straight to a screen from outside the phone, whatever is open right now. */
      jump(id) {
        if (busy) return;
        if (current) current.el.remove();
        current = null;
        overlay = null;
        const { base } = byId[id];
        go(base || id, 'enter');
        if (base) go(id, 'dialog');
      },
    };
    TX.enter = (next) => { enter(next); finishLayers(next, null); };
    return phone;
  }

  root.CbtlPhone = { createPhone, SCREEN_W, SCREEN_H };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// The clickable prototype's page around the phone: the screen list and the switcher.
(function () {
  const { TL } = window.CbtlMotion;
  const model = window.CBTL_MODEL;
  const { theme, screens } = model;
  const viewport = document.getElementById('viewport');
  const phone = window.CbtlPhone.createPhone(viewport, model);

  const list = document.getElementById('screen-list');
  const groups = {};
  for (const s of screens) {
    if (s.board) continue;
    (groups[s.group] = groups[s.group] || []).push(s);
  }
  for (const [group, items] of Object.entries(groups)) {
    const head = document.createElement('h2');
    head.textContent = group;
    list.appendChild(head);
    for (const s of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.title;
      b.dataset.id = s.id;
      b.addEventListener('click', () => phone.jump(s.id));
      list.appendChild(b);
    }
  }
  const mark = (id) => list.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  phone.listeners.push(mark);

  document.getElementById('replay').addEventListener('click', () => phone.jump('splash'));

  const aside = document.querySelector('aside');
  const device = document.getElementById('device');
  const wrap = document.getElementById('device-wrap');
  function fit() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    // On a phone the window itself is the phone, so no device is drawn around it.
    if (W <= 520) {
      const room = H - aside.offsetHeight;
      const scale = W / 390;
      viewport.style.height = device.style.height = `${room / scale}px`;
      device.style.transform = `scale(${scale})`;
      wrap.style.width = `${W}px`;
      wrap.style.height = `${room}px`;
      return;
    }
    viewport.style.height = device.style.height = '';
    const above = W <= 820 ? aside.offsetHeight + 8 : 0;
    const scale = Math.min(1, (H - 40 - above) / 868, (W - 24) / 414);
    device.style.transform = `scale(${scale})`;
    wrap.style.width = `${414 * scale}px`;
    wrap.style.height = `${868 * scale}px`;
  }
  window.addEventListener('resize', fit);
  fit();

  let t0 = performance.now();
  (function loop(now) { TL.advance(now - t0); requestAnimationFrame(loop); })(t0);
  document.fonts.ready.then(() => phone.go('splash', 'enter'));
  window.CBTL_PHONE = phone;
})();
</script>
