*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:#1E1B18;color:#FFFFFF;font:14px/1.5 'DM Sans',system-ui,sans-serif;display:flex;justify-content:center;gap:48px;padding:20px;overflow:hidden;-webkit-tap-highlight-color:transparent}
aside{width:300px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:none}
.back{align-self:flex-start;color:#FFFFFF;font-size:13px;font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
aside h1{font:700 28px/1.15 'DM Sans',system-ui,sans-serif;margin:0}
aside p{margin:0;color:#D2CAC0}
nav.switch{display:flex;gap:6px;flex-wrap:wrap}
nav.switch a{padding:6px 10px;border:1px solid #FFFFFF2E;border-radius:6px;color:#FFFFFF;text-decoration:none;font-size:12.5px}
nav.switch a[aria-current]{background:#C49A6C;color:#141210;border-color:#C49A6C;font-weight:700}
#replay{align-self:flex-start;padding:8px 12px;min-height:40px;background:transparent;color:#FFFFFF;border:1px solid #FFFFFF2E;border-radius:6px;font:inherit;cursor:pointer}
#screen-list{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:1px;border-top:1px solid #FFFFFF2E;padding-top:8px}
#screen-list h2{font:700 11px/1.4 'DM Sans',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#D2CAC0;margin:12px 0 4px}
#screen-list button{all:unset;display:block;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
#screen-list button:hover,#screen-list button:focus-visible{background:#FFFFFF2E}
#screen-list button[aria-current=true]{background:#C49A6C;color:#141210;font-weight:700}
#device-wrap{flex:none;align-self:center}
#device{width:414px;height:868px;transform-origin:top left;background:#0B0A0C;border-radius:58px;padding:12px;box-shadow:0 24px 70px #0000004d,0 0 0 1.5px #FFFFFF3D}
#viewport{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;background:#000}
.scroller::-webkit-scrollbar{display:none}
@media (max-width:820px){
body{flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:0 12px 12px}
aside{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:6px 0 4px}
.intro,.wide,#screen-list{display:none}
.back{align-self:center;display:inline-flex;align-items:center;min-height:36px;margin-right:auto}
nav.switch{flex-wrap:nowrap}
nav.switch a{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;padding:0 8px}
#replay{align-self:center;min-height:36px;padding:0 10px;font-size:12.5px}
.note{order:3;width:100%;font-size:11px;line-height:1.3}
}
@media (max-width:520px){
body{padding:0;gap:0}
aside{padding:4px 8px}
#device-wrap{align-self:flex-start;width:100vw;overflow:hidden}
#device{width:390px;padding:0;border-radius:0;box-shadow:none;background:none}
#viewport{border-radius:0}
}

  function createPhone(viewport, model) {
    const { theme, screens } = model;
    const byId = Object.fromEntries(screens.map((s) => [s.id, s]));
    const optionId = theme.id;

    let overlay = null; // { id, el }

    let autoTrack = null;

      el.style.position = 'absolute';

      el.style.top = '0';

          enter(next);
          tween(next.el, (e, v) => { e.style.transform = `translateY(${(1 - v) * 46}px)`; e.style.opacity = clamp(v * 1.8); }, { dur: 560, ease: E.slowOut });
          tween(old.el, (e, v) => { e.style.transform = `scale(${lerp(1, 0.95, clamp(v))})`; e.style.opacity = 1 - clamp(v * 1.4); }, { dur: 340, ease: E.out, done: () => finishLayers(next, old) });
          return;
        }
        zOf(next, 2);
        enter(next);
        tween(next.el, (e, v) => { e.style.transform = `translateX(${(1 - v) * 100}%)`; }, { sp: spring(220, 26), dur: 560, done: () => { next.el.style.transform = ''; } });
        tween(old.el, (e, v) => { e.style.transform = `translateX(${v * -22}%)`; e.style.filter = `brightness(${1 - 0.1 * clamp(v)})`; }, { sp: spring(220, 26), dur: 560, done: () => finishLayers(next, old) });
      },

      pop(next, old) {
        if (optionId === 'b') { TX.shutter(next, old); return; }
        if (optionId === 'c') {
          enter(next);
          tween(next.el, (e, v) => { e.style.transform = `scale(${lerp(0.96, 1, v)})`; e.style.opacity = clamp(v * 1.8); }, { dur: 520, ease: E.slowOut });
          tween(old.el, (e, v) => { e.style.transform = `translateY(${v * 40}px)`; e.style.opacity = 1 - clamp(v * 1.6); }, { dur: 300, ease: E.out, done: () => finishLayers(next, old) });
          zOf(old, 2);
          return;
        }
        zOf(old, 2);
        enter(next);
        tween(old.el, (e, v) => { e.style.transform = `translateX(${v * 100}%)`; }, { sp: spring(240, 28), dur: 520, done: () => finishLayers(next, old) });
        tween(next.el, (e, v) => { e.style.transform = `translateX(${(1 - v) * -22}%)`; }, { sp: spring(240, 28), dur: 520 });
      },

      tab(next, old) {
        const fromIndex = TAB_INDEX[old.screen.id.replace(/(Stamped|Unlocked|Stack|Empty|Terms|Claimed)$/, '')];
        const toIndex = TAB_INDEX[next.screen.id.replace(/(Stamped|Unlocked|Stack|Empty|Terms|Claimed)$/, '')];
        old.el.remove();
        enter(next);
        if (fromIndex !== undefined && toIndex !== undefined && fromIndex !== toIndex) tabIndicator(next, fromIndex, toIndex);
        finishLayers(next, null);
      },

      // Member Code: the button itself becomes the page.
      morph(next, old, origin) {
        const from = origin ? rectIn(origin) : { x: SCREEN_W - 80, y: SCREEN_H - 160, w: 60, h: 60 };
        if (optionId === 'c') {
          // Reserve: the white button grows and lands exactly on the white QR plate.
          const plate = next.el.querySelector('[data-name="QR plate"]');
          const to = plate ? rectIn(plate) : { x: 40, y: 200, w: 310, h: 310 };
          const s = shape('#FFFFFF');
          s.style.borderRadius = '30px';
          enter(next);
          tween(next.el, (e, v) => { e.style.opacity = clamp(v * 2); }, { dur: 320, ease: E.out });
          tween(s, (e, v) => {
            e.style.left = `${lerp(from.x, to.x, v)}px`;
            e.style.top = `${lerp(from.y, to.y, v)}px`;
            e.style.width = `${lerp(from.w, to.w, v)}px`;
            e.style.height = `${lerp(from.h, to.h, v)}px`;
            e.style.borderRadius = `${lerp(30, 28, v)}px`;
          }, { dur: 560, ease: E.slowOut, done: () => { tween(s, (e, v) => { e.style.opacity = String(1 - clamp(v)); }, { dur: 160, done: () => s.remove() }); finishLayers(next, old); } });
          return;
        }
        if (optionId === 'b') { flood(next, old, origin, theme.c.wood); return; }
        // Swirl: a circle opens out of the button, purple at its rim, the page inside.
        zOf(next, 2);
        const cx = from.x + from.w / 2;
        const cy = from.y + from.h / 2;
        const s = shape(theme.c.primary, 3);
        s.style.inset = '0';
        enter(next);
        const sp = spring(170, 24);
        TL.add({
          dur: 640, sp,
          frame: (v) => {
            const rad = lerp(30, 1000, clamp(v));
            next.el.style.clipPath = `circle(${rad}px at ${cx}px ${cy}px)`;
            s.style.clipPath = `circle(${rad}px at ${cx}px ${cy}px)`;
            s.style.opacity = String(1 - clamp(v * 2.4));
          },
          done: () => { next.el.style.clipPath = ''; s.remove(); finishLayers(next, old); },
        });
      },
    };
    TX.sheet = TX.push;
    TX.dialog = TX.push;

    /** The active tab mark travels. In Swirl its two edges ride different springs,
     *  so the leading edge stretches ahead. */
    function tabIndicator(layer, fromIndex, toIndex) {
      const tabs = [...layer.el.querySelectorAll('[data-name^="tab/"]')];
      const nav = layer.el.querySelector('[data-name="tab bar"]');
      if (!tabs.length || !nav) return;
      const mark = optionId === 'c' ? tabs[toIndex] : tabs[toIndex].querySelector('[data-name="indicator"]');
      if (!mark) return;
      const navBox = nav.getBoundingClientRect();
      const box = mark.getBoundingClientRect();
      const k = viewport.getBoundingClientRect().width / SCREEN_W;
      const left = (box.left - navBox.left) / k;
      const top = (box.top - navBox.top) / k;
      const w = box.width / k;
      const h = box.height / k;
      const step = (tabs[toIndex].getBoundingClientRect().left - tabs[fromIndex].getBoundingClientRect().left) / k;
      const color = getComputedStyle(mark).backgroundColor;
      const ghost = document.createElement('div');
      ghost.style.cssText = `position:absolute;top:${top}px;height:${h}px;background:${color};border-radius:${getComputedStyle(mark).borderRadius};pointer-events:none`;
      const saved = mark.style.background;
      mark.style.background = 'transparent';
      tabs.forEach((t) => { t.style.zIndex = '1'; });
      nav.insertBefore(ghost, nav.firstChild);
      const lead = spring(300, 26);
      const trail = spring(200, 22);
      const forward = step > 0;
      TL.add({
        dur: 620, sp: (t) => t,
        frame: (t) => {
          if (t === 1) return;
          const a = lead(t);
          const b = forward ? trail(t) : a;
          const rightEdge = left + w - step * (1 - (forward ? a : trail(t)));
          const leftEdge = left - step * (1 - (forward ? b : a));
          if (optionId === 'a') {
            ghost.style.left = `${leftEdge}px`;
            ghost.style.width = `${rightEdge - leftEdge}px`;
          } else {
            const e = (optionId === 'b' ? E.press : E.slowOut)(clamp(t / (optionId === 'b' ? 240 : 320)));
            ghost.style.left = `${left - step * (1 - e)}px`;
            ghost.style.width = `${w}px`;
          }
        },
        done: () => { mark.style.background = saved; ghost.remove(); },
      });
    }

    // ── Input ───────────────────────────────────────────────────────────────

    function wire(el) {
      el.querySelectorAll('[data-go]').forEach((node) => {
        node.setAttribute('role', 'button');
        node.tabIndex = 0;
        node.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); node.click(); } });
        node.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (phone.locked) return;
          go(node.dataset.go, node.dataset.tx, node);
        });
      });
    }

    const phone = {
      go, byId, listeners, screens, theme, locked: false, manualOnly: false,
      get current() { return current; },
      get screenId() { return overlay ? overlay.id : current && current.screen.id; },
      replay() { if (current) { const id = current.screen.id; current.el.remove(); current = null; overlay = null; go(id, 'enter'); } },
      /** Straight to a screen from outside the phone, whatever is open right now. */
      jump(id) {
        if (busy) return;
        if (current) current.el.remove();
        current = null;
        overlay = null;
        const { base } = byId[id];
        go(base || id, 'enter');
        if (base) go(id, 'dialog');
      },
    };
    TX.enter = (next) => { enter(next); finishLayers(next, null); };
    return phone;
  }

  root.CbtlPhone = { createPhone, SCREEN_W, SCREEN_H };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// The clickable prototype's page around the phone: the screen list and the switcher.
(function () {
  const { TL } = window.CbtlMotion;
  const model = window.CBTL_MODEL;
  const { theme, screens } = model;
  const viewport = document.getElementById('viewport');
  const phone = window.CbtlPhone.createPhone(viewport, model);

  const list = document.getElementById('screen-list');
  const groups = {};
  for (const s of screens) {
    if (s.board) continue;
    (groups[s.group] = groups[s.group] || []).push(s);
  }
  for (const [group, items] of Object.entries(groups)) {
    const head = document.createElement('h2');
    head.textContent = group;
    list.appendChild(head);
    for (const s of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.title;
      b.dataset.id = s.id;
      b.addEventListener('click', () => phone.jump(s.id));
      list.appendChild(b);
    }
  }
  const mark = (id) => list.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  phone.listeners.push(mark);

  document.getElementById('replay').addEventListener('click', () => phone.jump('splash'));

  const aside = document.querySelector('aside');
  const device = document.getElementById('device');
  const wrap = document.getElementById('device-wrap');
  function fit() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    // On a phone the window itself is the phone, so no device is drawn around it.
    if (W <= 520) {
      const room = H - aside.offsetHeight;
      const scale = W / 390;
      viewport.style.height = device.style.height = `${room / scale}px`;
      device.style.transform = `scale(${scale})`;
      wrap.style.width = `${W}px`;
      wrap.style.height = `${room}px`;
      return;
    }
    viewport.style.height = device.style.height = '';
    const above = W <= 820 ? aside.offsetHeight + 8 : 0;
    const scale = Math.min(1, (H - 40 - above) / 868, (W - 24) / 414);
    device.style.transform = `scale(${scale})`;
    wrap.style.width = `${414 * scale}px`;
    wrap.style.height = `${868 * scale}px`;
  }
  window.addEventListener('resize', fit);
  fit();

  let t0 = performance.now();
  (function loop(now) { TL.advance(now - t0); requestAnimationFrame(loop); })(t0);
  document.fonts.ready.then(() => phone.go('splash', 'enter'));
  window.CBTL_PHONE = phone;
})();
</script>
